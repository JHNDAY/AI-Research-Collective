<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Materials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;600;700&family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Oswald:wght@300;400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:      #FAF8F2;
      --paper:      #FFFFFF;
      --ink:        #18160F;
      --navy:       #1B3557;
      --navy-dk:    #112240;
      --gold:       #9A7C2F;
      --gold-lt:    #F5EDD6;
      --gold-bright:#F6C945;
      --teal:       #1A6B72;
      --teal-lt:    #E4F2F3;
      --rule:       #D6CFC0;
      --muted:      #6B6456;
      --blue-lt:    #E8F0F8;
      --shadow:     0 2px 16px rgba(24,22,15,.07);
      --shadow-lg:  0 6px 32px rgba(24,22,15,.13);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* ── HEADER SECTION ── */
    .header-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--navy-dk);
      margin-bottom: 8px;
      letter-spacing: -.01em;
      line-height: 1.2;
    }

    .subtext {
      font-family: 'Oswald', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .05em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .header-image {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: var(--shadow-lg);
      display: block;
    }

    /* ── DATE BADGE ── */
    .date-badge {
      display: inline-block;
      background: var(--gold-bright);
      color: var(--ink);
      font-family: 'Oswald', sans-serif;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 4px 10px;
      border-radius: 3px;
      margin-right: 10px;
    }

    /* ── CARD ── */
    .card {
      background: linear-gradient(135deg, rgba(255,255,255,.95) 0%, rgba(240,232,212,.6) 100%);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--ink);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ── LINKS ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: block;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--navy) 0%, #274B6E 100%);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 4px;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: .01em;
      transition: all 0.2s ease;
      border: 1px solid rgba(27,53,87,.4);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(27,53,87,.25);
      background: linear-gradient(135deg, #0F2A47 0%, #1B3557 100%);
    }

    .link-btn:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <h1 class="main-title">Narrating Thought: From Idea to Prompt</h1>
    <p class="subtext">Use Case : Weapons Innovation</p>
    <img src="https://jhnday.github.io/JhndayRprts/Patriot_Drone.png" alt="Patriot Drone" class="header-image">
  </div>

  <div class="card">
    <div class="card-title">
      <span class="date-badge">JUL 29, 2026</span>
      Session Materials
    </div>
    <div class="links">
      <a href="https://jhnday.github.io/AI-Research-Collective/Foundations" class="link-btn" target="_blank" rel="noopener">🏛️ Foundations of AI Conversation</a>
      <a href="https://docs.google.com/document/d/1lOSykEjVuPqbkn79eh-sqCN3HH84xW7lJ-kqNlPL6HQ/edit?tab=t.0" class="link-btn" target="_blank" rel="noopener">📝 Narrative Examples</a>
      <a href="https://jhnday.github.io/AI-Research-Collective/transduction_interactive_tokenizer" class="link-btn" target="_blank" rel="noopener">🔭 The Bifocal View : The Semantic Dissolve</a>
      <a href="https://jhnday.github.io/AI-Research-Collective/how-to-prompt-and-visualize" class="link-btn" target="_blank" rel="noopener">🎤 Narrating a Prompt</a>
      <a href="https://jhnday.github.io/AI-Research-Collective/writing_coach_interactive" class="link-btn" target="_blank" rel="noopener">🌉 Bridging Human Thought &amp; Machine Understanding</a>
      <a href="https://jhnday.github.io/AI-Research-Collective/writing_coach" class="link-btn" target="_blank" rel="noopener">📄 Writing Coach</a>
    </div>
  </div>
</div>

</body>
</html>
